name: Desk live prices

# Publishes the desk's reference closes (three months of daily closes for the seven USD pairs) as one
# JSON file on the `desk-live` branch. That branch holds a single commit that is replaced on every run,
# so main's history stays clean. The closes change once a day; live quotes are fetched by the desk
# itself in the browser. GitHub starts this repo's scheduled jobs hours late, so the daily whale-flow
# job publishes the file too; this hourly schedule is a second chance, not something the desk relies on.
on:
  schedule:
    - cron: '7 * * * 1-5'       # hourly, Monday to Friday (UTC)
    - cron: '7 21-23 * * 0'     # Sunday evening: the week's open
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desk-live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Pull reference closes
        run: node scripts/desk-live.mjs --out "$RUNNER_TEMP/live.json"

      - name: Publish to the desk-live branch (one commit, force-pushed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          git init -q -b desk-live
          cp "$RUNNER_TEMP/live.json" live.json
          git add live.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "reference closes $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" desk-live
