name: Whale flow

# Runs the collectors in GitHub's cloud so the laptop doesn't have to be on.
# Each run: collect Hyperliquid whale flow -> aggregate multi-venue smart money
# -> rebuild the static dashboard -> commit the snapshots -> publish to Pages.

on:
  schedule:
    - cron: '0 22 * * *'   # daily 22:00 UTC
  workflow_dispatch:        # manual "Run workflow" button

# Never let two runs write snapshots at once.
concurrency:
  group: whale-flow
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # commit the day's snapshots back to the repo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # No install step: the collectors use only Node's built-in fetch.

      # Every collector is INDEPENDENT and non-fatal. One upstream API having a bad day
      # must not cost us the other five feeds or block the deploy — the dashboard renders
      # whatever snapshots exist, and a missing feed shows its last known date rather than
      # vanishing. Failures stay visible in the step list and in the summary below.

      - name: Collect whale flow
        id: whale
        continue-on-error: true
        run: node scripts/whale-flow.mjs

      - name: Aggregate smart money
        id: smart
        continue-on-error: true
        # Optional keys — connectors self-skip when these are unset.
        # NOTE: Binance geo-blocks GitHub's US runners (HTTP 451), so binance-top and
        # binance-taker contribute nothing here. The coverage report in the snapshot
        # records the resulting smart-tier shortfall instead of hiding it.
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID: ${{ secrets.DUNE_QUERY_ID }}
        run: node scripts/smart-money.mjs

      - name: Score trader trust
        id: trust
        continue-on-error: true
        run: node scripts/trust.mjs --top 60

      - name: Track own book
        id: portfolio
        continue-on-error: true
        run: node scripts/portfolio.mjs

      - name: Collect insider filings (SEC Form 4)
        id: insiders
        continue-on-error: true
        # SEC fair-access requires a declaring User-Agent with a real contact.
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'my-trading-project research nathan.vuillemin@gmail.com' }}
        run: node scripts/insiders.mjs --days 3 --max 250

      - name: Collect macro flows (CFTC COT + exchange flows)
        id: macro
        continue-on-error: true
        run: node scripts/macro-flows.mjs

      - name: Collect institutional 13F holdings
        id: inst
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'my-trading-project research nathan.vuillemin@gmail.com' }}
        run: node scripts/institutions.mjs

      - name: Collect macro pulse (stablecoins + options + sentiment)
        id: pulse
        continue-on-error: true
        run: node scripts/macro-pulse.mjs

      - name: Build dashboard
        run: node scripts/build-dashboard.mjs

      - name: Summarise collector outcomes
        if: always()
        run: |
          {
            echo "### Collector results"
            echo ""
            echo "| feed | result |"
            echo "|---|---|"
            echo "| whale-flow | ${{ steps.whale.outcome }} |"
            echo "| smart-money | ${{ steps.smart.outcome }} |"
            echo "| trust | ${{ steps.trust.outcome }} |"
            echo "| portfolio | ${{ steps.portfolio.outcome }} |"
            echo "| insiders | ${{ steps.insiders.outcome }} |"
            echo "| macro-flows | ${{ steps.macro.outcome }} |"
            echo "| institutions | ${{ steps.inst.outcome }} |"
            echo "| macro-pulse | ${{ steps.pulse.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # A step succeeding does not mean its data is usable. Feeds degrade without failing —
      # a throttled API returns empty instead of erroring, a geo-blocked source silently
      # leaves a composite. This inspects what actually landed and prints it into the run
      # summary, so a green run with rotten data is visible rather than assumed fine.
      - name: Data health
        if: always()
        continue-on-error: true
        run: |
          {
            echo ""
            echo "### Data health"
            echo ""
            echo '```'
            node scripts/health.mjs || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/health.mjs

      - name: Commit snapshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dashboard
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: data snapshot $(date -u +%Y-%m-%d)"
          # Someone pushing while this ran would otherwise fail the push and lose the
          # snapshot. Rebase onto whatever landed and retry; snapshots are additive files
          # so a rebase is safe here.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main."
            git pull --rebase --autostash origin main || exit 1
          done
          echo "Could not push after 3 attempts." >&2
          exit 1

      - name: Upload dashboard for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
