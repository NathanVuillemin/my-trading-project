name: Whale flow

# Runs the collectors in GitHub's cloud so the laptop doesn't have to be on.
# Each run: collect Hyperliquid whale flow -> aggregate multi-venue smart money
# -> rebuild the static dashboard -> commit the snapshots -> publish to Pages.

on:
  schedule:
    - cron: '0 22 * * *'   # daily 22:00 UTC
  workflow_dispatch:        # manual "Run workflow" button

# Never let two runs write snapshots at once.
concurrency:
  group: whale-flow
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # commit the day's snapshots back to the repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step: the collectors use only Node's built-in fetch.

      - name: Collect whale flow
        run: node scripts/whale-flow.mjs

      - name: Aggregate smart money
        # Optional keys — connectors self-skip when these are unset.
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID: ${{ secrets.DUNE_QUERY_ID }}
        run: node scripts/smart-money.mjs

      - name: Build dashboard
        run: node scripts/build-dashboard.mjs

      - name: Commit snapshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dashboard
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: whale-flow snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload dashboard for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
